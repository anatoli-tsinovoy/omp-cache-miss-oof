name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Validate clean plugin install
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/plugin-smoke"
          printf '{"name":"plugin-smoke","private":true}' > "$RUNNER_TEMP/plugin-smoke/package.json"
          cd "$RUNNER_TEMP/plugin-smoke"
          bun install "$RUNNER_TEMP/omp-cache-miss-oof-0.1.0.tgz"
          bun -e 'await import("omp-cache-miss-oof/src/index.ts")'
      - run: bun run check
      - run: bun test
      - run: bun run generate:sounds
      - run: git diff --exit-code -- sounds
